; EVA 协处理器固件 — PlatformIO 配置骨架
; 各模块一个 [env]。共享协议库放在 lib/eva_protocol（阶段1实现）。

[platformio]
default_envs = module1_base

[env]
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17

; 模块1底座：ESP32-S3，驱动一个电机并讲 EVA 协议
[env:module1_base]
platform = espressif32
board = esp32-s3-devkitc-1
build_src_filter = +<../modules/module1_base/>
; 阶段1按需添加：lib_deps = ...（如电机驱动库）
